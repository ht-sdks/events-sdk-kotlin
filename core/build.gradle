plugins {
    id 'java-library'
    id 'kotlin'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

compileKotlin {
    kotlinOptions {
        freeCompilerArgs += [
                "-Xopt-in=kotlin.RequiresOptIn"
        ]
    }
}

test {
    useJUnitPlatform()

    if (System.getenv("CI") != null) {
        // Prevent indefinite hangs in CI and surface the exact timed-out test.
        systemProperty "junit.jupiter.execution.timeout.default", "2 m"
    }

    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

dependencies {
    // MAIN DEPS
    api 'com.segment:sovran-kotlin:1.2.2'
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1"
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'

    // TESTING
    repositories { mavenCentral() }
    testImplementation 'io.mockk:mockk:1.10.6'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    testImplementation platform("org.junit:junit-bom:5.7.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

apply from: rootProject.file('gradle/artifacts-core.gradle')
apply from: rootProject.file('gradle/mvn-publish.gradle')
apply from: rootProject.file('gradle/codecov.gradle')

// core has no Android BuildConfig, so LIBRARY_VERSION is hand-maintained in Constants.kt
// and can drift from VERSION_NAME — guard against that.
tasks.register("verifyVersionSync") {
    description = "Checks that Constants.LIBRARY_VERSION matches gradle.properties VERSION_NAME."
    group = "verification"
    doLast {
        def constantsFile = file("src/main/java/com/hightouch/analytics/kotlin/core/Constants.kt")
        def matcher = constantsFile.text =~ /LIBRARY_VERSION\s*=\s*"([^"]+)"/
        if (!matcher.find()) {
            throw new GradleException("Could not find LIBRARY_VERSION in ${constantsFile}")
        }
        def libraryVersion = matcher.group(1)
        if (libraryVersion != VERSION_NAME) {
            throw new GradleException(
                    "Version mismatch: Constants.LIBRARY_VERSION ($libraryVersion) != " +
                    "gradle.properties VERSION_NAME ($VERSION_NAME). Update both to match.")
        }
    }
}

tasks.named("check").configure { dependsOn("verifyVersionSync") }