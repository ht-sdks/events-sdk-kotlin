# JitPack build config — see RELEASING.md.
# - openjdk17: required by the Android Gradle plugin since the Kotlin 2.4 / AGP upgrade.
# - Publish only the library modules, so the build needs no write key / google-services.json.
# - -Prelease: publish without the -SNAPSHOT suffix.
jdk:
  - openjdk17
install:
  - ./gradlew -Prelease :core:publishToMavenLocal :android:publishToMavenLocal :android-push:publishToMavenLocal
